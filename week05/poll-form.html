<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WSS 130 | HTML Form - User Poll</h1>

    </header>
    <main>
        <fieldset>
            <legend>Contact Information</legend>
            <form>
                <div class="form-item column 2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>


                <div class="form-item column 2"></div>
                <label for="email">Email Address:</label>
                <input type="email" name="usermail" id="usermail" required>
                </div>


                <legend>Questions</legend>

                <div class="form-item column1">
                    <label for="browser">Select your favorite browser</label>
                    <select name="browser" id="browser">
                        <option value="none">none selected</option>
                        <option value="Chrome">Chrome</option>
                        <option value="Safari">Safari</option>
                        <option value="Brave">Brave</option>

                    </select>
                </div>


                <div class="form-item column1">
                    <label for="checkbox">Do you have a household pet?</label>
                    <input type="checkbox" name="pet" id="Pet">
                </div>


                <div class="form-item">
                    <label for="textarea">List the places you have Lived</label>
                    <textarea name="feedback" id="feedback" rows="3"
                      placeholder="Buenos Aires Argentina, Manaus Brazil, La Paz Bolivia"></textarea>
                </div>
            </form>
        </fieldset>
        <button type="submit">Submit Poll</button>
    </main>
    <footer>
        ©️ 2026 | HTML Form - User Form Poll Activity | Santiago Sburlati
    </footer>
</body>

</html>
