<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <form>


        </form>
    </header>
    <main>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email Address:</label>
        <input type="email" name="usermail" id="usermail" required>
        <label for="browser">Select your favorite browser</label>
        <select name="browser" id="browser">
            <option value="none">none selected</option>
            <option value="Chrome">Chrome</option>
            <option value="Safari">Safari</option>
            <option value="Brave">Brave</option>
        </select>
        <label for="checkbox">Do you have a household pet?</label>
        <input type="checkbox" name="checkbox" id="Pet">
    </main>
    <footer>

    </footer>
</body>

</html>
