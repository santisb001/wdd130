<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>Team</th>
                <th>Record</th>
                <th>Player Count</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Southern</td>
                <td>Parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td>Catarina</td>
                <td>49-24</td>
                <td>10</td>
            </tr>
            <tr>
                <td rowspan="3">Western</td>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <td>Acre</td>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td>10-07</td>
                <td>12</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Total Players</th>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <button type="submit">Submit</button>
    </form>
    <form>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <label><input type="checkbox" id="newsletter" name="newsletter"> Send me updates</label>

        <button type="submit">Send Message</button>
    </form>
    <form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="123-456-7890">

        <button type="submit">Submit Contact Information</button>
    </form>

    <form>
        <label>Full Name: <input type="text" name="fullname" required></label>
        <label>Email: <input type="email" name="useremail" required></label>
    </form>
</body>

</html>
