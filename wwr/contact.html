<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Splash: White Water Rafting</title>
    <meta name="description"
      content="An contact us web page for fictional white water rafting company where you can access the contact information of the company.">
    <meta name="author" content="Santiago Sburlati">
    <link rel="stylesheet" href="styles/rafting2.css">
</head>

<body>
    <header>
        <img src="images/logos/wwr-logo.png" alt="wwr logo">
        <nav>
            <ul class="flex-container">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/paddling-imgg.jpg" alt="Lake with mountains at the end and a paddle">
            <div class="paddle">
                <h1>SPLASH: White Water Rafting</h1>


                <p>Boulevard De La Rivera 55</p>
                <p>San Fernando, Buenos Aires, Argentina</p>
                <p>+54 11 1111 9999</p>
                <p>info@splashwwr.com</p>

            </div>


            <div class="contactinfo">
                <!-- MAP -->
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d210833.1267879482!2d-58.65048572236346!3d-34.34366680859395!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcb1d20a30183d%3A0xfd11c7a30b05f2fc!2sKayak%20R%C3%ADo%20de%20la%20Plata!5e0!3m2!1ses-419!2sar!4v1786215283091!5m2!1ses-419!2sar"></iframe>
                </div>

                <!-- FORM -->
                <form>
                    <div>
                        <label for="q1">Name</label>
                        <input type="text" name="q1" id="q1">
                    </div>
                    <div>
                        <label for="q2">Email</label>
                        <input name="q2" id="q2"></input>
                    </div>

                    <div>
                        <span class="form-label">Message<br>Purpose</span>
                        <div class="radio namemail">
                            <label for="q3">General Inquiry</label>
                            <input type="radio" id="q3" name="radio">
                            <label for="q4">Reservation Question</label>
                            <input type="radio" id="q4" name="radio">
                            <label for="q5">Website Suggestion</label>
                            <input type="radio" id="q5" name="radio">
                        </div>
                    </div>
                    <div>
                        <label for="q4">Message</label>
                        <textarea name="q6" id="q6" placeholder="Type here"></textarea>
                    </div>

                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                    <input type="checkbox" name="newsletter" id="newsletter">


                    <button type="submit">Get in touch</button>
                </form>
            </div>
        </div>

        <!-- EMPLOYEE PICTURE-->
        <section class="history ">
            <h2>We are here to serve you</h2>
            <figure>
                <img src="images/employee-1.jpg" alt="Employee 1 a girl employee">
                <figcaption>Constance Jhonson - Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee-3.jpg" alt="happy employee in the river">
                <figcaption>Emily Mayers - Lead guide</figcaption>
            </figure>
            <figure>
                <img src="images/hero-img/employee-2.jpg" alt="male employee in front of the river">
                <figcaption>John Stone - Director</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© 2026 ⚜️ Splash: White Water Rafting ⚜️ Santiago Sburlati</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/logos/facebook-logo.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/logos/linkedin-logo.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/logos/instagram-logo.png" alt="Instagram Icon">
            </a>
        </nav>

    </footer>

</body>

</html>
